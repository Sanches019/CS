name: Canonicalize final Yupoo catalogue v3

on:
  pull_request:
    paths:
      - 'canonicalize_yupoo_v3.py'
      - '.github/workflows/canonicalize-yupoo-v3.yml'

permissions:
  contents: read
  actions: read

jobs:
  canonicalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download exact audited catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous_v3
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9371219353/zip" \
            --output /tmp/catalog.zip
          unzip -q /tmp/catalog.zip -d previous_v3
          test -s previous_v3/catalog.json
      - name: Canonicalize catalogue
        run: python -u canonicalize_yupoo_v3.py
      - uses: actions/upload-artifact@v4
        with:
          name: yupoo-football-shirt-catalog-v3
          path: out_v3/
          retention-days: 14

# Trigger marker: v3 canonicalization ready.
