name: KickCrate pilot product images

on:
  pull_request:
    paths:
      - 'kc_download_pilot_images.py'
      - '.github/workflows/kc-pilot-images.yml'

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python -u kc_download_pilot_images.py
      - uses: actions/upload-artifact@v4
        with:
          name: kickcrate-pilot-images
          path: pilot_images/
          retention-days: 2
