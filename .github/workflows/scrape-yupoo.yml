name: Scrape authorized Yupoo football shirts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scrape_yupoo.py'
      - 'scrape_yupoo_v2.py'
      - 'requirements.txt'
      - '.github/workflows/scrape-yupoo.yml'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scrape and audit source catalog
        run: python -u scrape_yupoo_v2.py
      - name: Upload catalog audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yupoo-football-shirt-catalog-v2
          path: out/
          retention-days: 7
          if-no-files-found: error
