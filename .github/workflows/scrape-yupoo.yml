name: Scrape authorized Yupoo football shirts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scrape_yupoo.py'
      - 'requirements.txt'
      - '.github/workflows/scrape-yupoo.yml'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scrape and audit source catalog
        run: python -u scrape_yupoo.py
      - name: Commit audit output
        if: always()
        run: |
          if [ -d out ] && [ "$(find out -type f | wc -l)" -gt 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add out/
            git commit -m "Update Yupoo football shirt catalog audit" || true
            git push || true
          fi
      - name: Upload catalog audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yupoo-football-shirt-catalog
          path: out/
          retention-days: 7
          if-no-files-found: error
