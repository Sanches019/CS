name: Visual QA unresolved Yupoo shirts

on:
  pull_request:
    branches: [main]
    paths:
      - 'make_unresolved_contact_sheets.py'
      - '.github/workflows/unresolved-visual-qa.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - name: Download exact unresolved audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p visual_input
          curl --fail --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9369406250/zip" \
            --output /tmp/exact.zip
          unzip -q /tmp/exact.zip -d visual_input
          test -s visual_input/unresolved.json
      - name: Build visual review sheets
        run: python -u make_unresolved_contact_sheets.py
      - name: Upload visual QA sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yupoo-unresolved-visual-qa
          path: visual_qa/
          retention-days: 7
          if-no-files-found: error
